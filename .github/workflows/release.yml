name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml version
        run: |
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: ${CARGO_VERSION} / tag: ${TAG_VERSION}"
          if [ "${CARGO_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
          if ! echo "${TAG_VERSION}" | grep -Eq '^[0-9]{2}\.(1[0-2]|[1-9])\.[0-9]+$'; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not CalVer vYY.MM.MICRO (months are not zero-padded)"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/apple-health-mcp" \
            "dist/apple-health-mcp-${GITHUB_REF_NAME}-${{ matrix.target }}"
      - name: Build MCP bundle
        run: |
          ./scripts/build-mcpb.sh \
            "target/${{ matrix.target }}/release/apple-health-mcp" \
            "dist/apple-health-mcp-${GITHUB_REF_NAME}-${{ matrix.target }}.mcpb"
      - uses: actions/upload-artifact@v7
        with:
          name: apple-health-mcp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: apple-health-mcp-*

      - name: Prepare release assets
        run: |
          mkdir release
          for dir in artifacts/apple-health-mcp-*/; do
            cp "$dir"/* release/
          done
          cd release
          sha256sum apple-health-mcp-* > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" &>/dev/null; then
            gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --repo "${GITHUB_REPOSITORY}"
          else
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber --repo "${GITHUB_REPOSITORY}"
          fi

  formula:
    name: Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FORMULA: Formula/apple-health-mcp.rb
    steps:
      - uses: actions/checkout@v7
      - name: Download checksums
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --pattern SHA256SUMS --dir dist --repo "${GITHUB_REPOSITORY}"
      - name: Render Homebrew formula
        run: scripts/update-formula.sh "${GITHUB_REF_NAME}" dist/SHA256SUMS
      - name: Commit Homebrew formula
        run: |
          branch="$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)"
          # Committing through the contents API keeps the commit signed by
          # GitHub instead of landing unsigned from the runner.
          args=(
            -f "message=Update Homebrew formula for ${GITHUB_REF_NAME}"
            -f "branch=${branch}"
            -f "content=$(base64 -w0 "$FORMULA")"
          )
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${FORMULA}?ref=${branch}" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            args+=(-f "sha=${sha}")
          fi
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${FORMULA}" "${args[@]}"
